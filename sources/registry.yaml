    license_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
    robots: "www.gov.uk/robots.txt — /api/content 막지 않음(일부 봇만 전체 차단). 실시간 확인"
    refresh: daily
    daily_limit: 260
    interval_s: 1
    script: advisories_uk
    status: active
  - id: holidays_lib
    name: 공휴일 — python-holidays 라이브러리(네트워크 없음, 약 150개 나라)
    kind: lib
    url: https://pypi.org/project/holidays/
    license: MIT
    attribution: "python-holidays (MIT)"
    robots: "네트워크 요청 없음"
    refresh: weekly
    daily_limit: 1
    interval_s: 1
    script: holidays_lib
    status: active
