    attribution: "Contains information licensed under the Open Government Licence – Canada"
    license_url: https://open.canada.ca/data/en/dataset/bef2ebb3-ca9a-485f-aaff-5dc36eb89426
    robots: "data.international.gc.ca/robots.txt 없음(404 = 허용)"
    refresh: daily
