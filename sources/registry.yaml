    name: 오픈데이터 카탈로그 발견기(CKAN·data.europa.eu·Mobility Database 신규 피드)
    kind: api
    url: "open.canada.ca · catalog.data.gov · data.gov.uk · data.europa.eu (catalogs 아래)"
    license: "메타데이터만 읽음. 찾은 데이터셋은 라이선스 자동 판정 → 열린 것만 active"
    attribution: "각 카탈로그"
    robots: "실시간 확인"
    refresh: daily
    daily_limit: 200
    interval_s: 2
    script: discover
    status: active
  - id: open_dataset
    name: 발견기가 찾아 열린 라이선스로 판정한 데이터셋(CSV·JSON·GeoJSON) 일반 수집
    kind: dump
    url: "(discovered.json 의 각 자원)"
    license: "데이터셋마다(행마다 기록)"
    attribution: "데이터셋마다"
    robots: "실시간 확인"
    refresh: hourly
    daily_limit: 300
    interval_s: 2
    script: open_dataset
    shards: 4
    status: active
  - id: commons_photos
    name: 장소 사진 층 — Wikidata P18 → Wikimedia Commons(CC0·CC BY·CC BY-SA) + 한국 TourAPI firstimage(공공누리 1·3유형)  (11/15)
    kind: api
    url: https://www.wikidata.org/w/api.php · https://commons.wikimedia.org/w/api.php   # (11/18) 두 주소 모두 robots Disallow /w/ → 기본 꺼짐(TL_WIKI_API=1 일 때만). 지금은 한국 TourAPI 사진만, Commons 사진은 commons_sdc
    license: "사진마다 — CC0-1.0 · CC-BY · CC-BY-SA(판 무관)만 싣고, 행마다 photo_license·photo_credit(저작자)·photo_page 를 남긴다. 한국: KOGL 제1·3유형(3유형 no_modify)"
    attribution: "사진: 저작자 · 라이선스 (위키미디어 공용) / 사진: 한국관광공사 · 공공누리 제N유형"
    license_url: https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia
    robots: "(11/18 정정) /w/api.php 는 robots.txt Disallow — 기본으로 부르지 않는다. 예전 설명: Wikimedia API 예절: 식별 UA(이 등록부 user_agent), 한 번에 한 요청(시간당 조각 1개 — run.HEAVY_CAP), 1.2초 간격, 429 면 Retry-After"
    refresh: weekly
    daily_limit: 1
    interval_s: 1
    script: photos
    shards: [korea, japan, taiwan_hk_mo, sea_mainland, sea_islands, europe_west, europe_south, europe_central, europe_north, us_west, us_east, us_hi_ak, oceania, micronesia, china, mongolia_central_asia, europe_southeast, canada, mexico_caribbean, south_asia, middle_east, africa_north, africa_sub, south_america, russia]
    status: active
  # ---- 후보: 확인이 끝나지 않아 받지 않는다 ----
  - {id: nager_date, name: Nager.Date 공휴일 API, kind: api, url: "https://date.nager.at/api/v3", license: "미확인(코드 MIT 로 알려짐, 자료 라이선스·약관 페이지 확인 못 함)", status: candidate}
