# 트립루티 출처 등록부 — 여기 status: active 인 것만 수집한다. candidate 는 확인이 끝나기 전까지 받지 않는다.
# 확인(2026-11-15, 118기): 약관·라이선스 페이지 또는 공식 API 의 라이선스 표기를 직접 보고, robots.txt 를 받아 봤다.
# robots 는 수집 때마다 실시간으로 다시 확인한다(common.Http). 금지 목록(인스타그램·틱톡·네이버·카카오·구글·타벨로그·트립어드바이저·비공식 API)은
# 등록하지 않으며, 링크·씨앗에 섞여 와도 common.forbidden 이 자동으로 버린다.
# 칸: id · name · kind(api|dump|feed|crawl|lib) · url · license · attribution · robots(확인 결과) · refresh(hourly|daily|weekly|monthly)
#     daily_limit(조각당 하루 요청 수) · interval_s(같은 사이트 요청 간격, 최소 1초) · script(scripts/collect/collectors.py 의 함수) · shards · secret(필요한 Secret 이름)
version: 1
user_agent: "TripRoutie-collector/1.0 (+https://github.com/joon0515/triproutie-pipeline)"
# 쓰지 않는 출처(2026-11-17 출처·라이선스 전수 점검). 수집·가공·게시·서버 함수 어디에도 넣지 않는다. tests/test_banned_sources.py 가 지킨다.
banned:
  - {id: hko_normals, hosts: [hko.gov.hk, weather.gov.hk], why: "홍콩천문대 자료(평년값 등) — 상업 목적은 사전 서면 허락 없이는 못 씀. 기후는 NASA POWER 로 계산(scripts/climate, PR #22)"}
  - {id: blog_aggregates, hosts: [blog.naver.com, tistory.com, brunch.co.kr, blogspot.com, ameblo.jp, hatenablog.com, note.com], why: "블로그 글에서 뽑은 체류 시간·순서·평가 집계값 — robots 차단·허락 근거 없음. 사실값도 싣지 않는다"}
  - {id: adsbdb, hosts: [adsbdb.com], why: "약관·라이선스 글 없음 — functions/flight_free.js 의 NOTERMS_OK 로 잠금"}
  - {id: hexdb, hosts: [hexdb.io], why: "약관 못 찾음 — 위와 같음"}
sources:
  - id: overture_places
    name: Overture Maps Places (GeoParquet, 월간 릴리스)
    kind: dump
    url: s3://overturemaps-us-west-2/release/<release>/theme=places/type=place/
    license: "CDLA-Permissive-2.0 / Apache-2.0(Foursquare) / CC0-1.0(AllThePlaces) — 레코드별 sources[].license"
    attribution: "© Overture Maps Foundation (CDLA-Permissive-2.0) · Foursquare 출처 레코드: Copyright 2024 Foursquare Labs, Inc. (Apache-2.0) · 레코드별 sources 속성 유지"
    license_url: https://docs.overturemaps.org/attribution/
    robots: "S3 공개 버킷(익명 읽기, robots 대상 아님). 공식 문서가 익명 S3 접근을 안내"
    refresh: monthly
    daily_limit: 1
    interval_s: 1
    script: overture
    shards: countries          # tools/world_regions.json 의 지역×나라 상자별
    status: active
  - id: fsq_os_places
    name: Foursquare Open Source Places (Iceberg 카탈로그, 월간)
    kind: dump
    url: https://catalog.h3-hub.foursquare.com/iceberg  (places.datasets.places_os)
    license: Apache-2.0
    attribution: "Copyright 2024 Foursquare Labs, Inc. Licensed under the Apache License, Version 2.0"
    license_url: https://docs.foursquare.com/data-products/docs/access-fsq-os-places
    robots: "공식 Iceberg 카탈로그(토큰 접속, robots 대상 아님). 옛 공개 S3 는 PMTiles 만 남음. Hugging Face 판은 연락처 동의가 필요해 쓰지 않음"
    refresh: monthly
    daily_limit: 1
    interval_s: 1
    script: fsq
    shards: countries
    secret: FSQ_TOKEN           # places-world 가 이미 쓰는 것과 같은 Secret
    status: active
  - id: wikivoyage
    name: Wikivoyage 덤프 (see/do/eat/drink/sleep/buy listing 틀)
    kind: dump
    url: https://dumps.wikimedia.org/<lang>wikivoyage/latest/<lang>wikivoyage-latest-pages-articles.xml.bz2
    license: CC-BY-SA-4.0
    attribution: "Wikivoyage contributors (CC BY-SA 4.0) — 문서 주소로 링크. 본문 설명문은 싣지 않고 사실값(이름·좌표·시간·요금·공식 주소)만"
    license_url: https://en.wikivoyage.org/w/api.php?action=query&meta=siteinfo&siprop=rightsinfo
    robots: "dumps.wikimedia.org/robots.txt 없음(404 = 허용). 덤프 서버 권장: 동시 연결 2개 이하"
    refresh: monthly
    daily_limit: 4
    interval_s: 5
    script: wikivoyage
    shards: [en, de, fr, ja, zh, it, es, nl, ru, pl]
    status: active
  - id: wikidata_official
    name: Wikidata(QLever 공개 SPARQL 끝점) — 박물관·공항·관광지의 공식 웹사이트(P856)·좌표·다국어 이름 (웹 탐색 씨앗)
    kind: api
    url: https://qlever.dev/api/wikidata
    license: CC0-1.0
    attribution: "Wikidata (CC0)"
    license_url: https://www.wikidata.org/wiki/Wikidata:Licensing
    robots: "query.wikidata.org/robots.txt 가 Disallow /sparql → 쓰지 않음. qlever.dev(프라이부르크대 QLever) robots.txt 없음(404 = 허용)·API 200 확인. 쿼리 1개씩 5초 간격"
    refresh: weekly
    daily_limit: 60
    interval_s: 5
    script: wikidata_seeds
    status: active
    # (11/17, 218기) 장소 소개 층 desc-wd-*(scripts/place_desc.py, process 의 place-desc 단계)도 같은 끝점·예절로 받는다.
    #  www.wikidata.org/w/api.php 는 robots.txt 가 User-agent * 에 Disallow /w/ → place_desc 는 쓰지 않는다. 이름 검색 없이 QID(수집 층 wd · 타일 id · OSM wikidata 태그)로만 묻는다.
    # (11/18, 223기) 같은 SPARQL 한 번에 라벨·P18(대표 사진 파일)도 받아 scripts/place_names.py 가 이름 5개 언어 층 names-wd-*(CC0)·사진 층 photos-wd-* 를 만든다.
    #  사진 라이선스·저작자는 Commons 구조화 데이터(아래 commons_sdc)에서 확인한 것만 싣는다.
    fields: [labels, descriptions, P18]
    desc_langs: [ko, en, ja, zh-hans, zh-cn, zh-sg, zh-my, zh-hant, zh-tw, zh-hk, zh-mo, zh]
    desc_daily_limit: 3000      # place_desc 의 하루 SPARQL 요청 수(한 번에 QID 250개)
    photo_daily_limit: 1500     # place_names 의 하루 Commons SDC 요청 수(한 번에 파일 40개)
    photo_interval_s: 15
    photo_extra_min: 8          # place-desc 예산 끝난 뒤 Commons 판정에 더 쓰는 분(process.yml place-desc 75분 한도 안)
  - id: commons_sdc
    name: Wikimedia Commons 구조화 데이터(QLever wikimedia-commons 공개 SPARQL) — 사진 파일의 라이선스(P275)·저작자(P170 의 P2093/P4174)만 (11/18)
    kind: api
    url: https://qlever.dev/api/wikimedia-commons
    license: "사진마다 — CC0-1.0 · CC-BY · CC-BY-SA(국제판·Generic·Unported 판 목록, scripts/place_names.LICENSES)만 싣고, 행마다 photo_license·photo_credit(저작자)·photo_page 를 남긴다. 저작자 없음·목록 밖은 싣지 않음. 사진은 링크만"
    attribution: "사진: 저작자 · 라이선스 (위키미디어 공용)"
    license_url: https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia
    robots: "commons.wikimedia.org/robots.txt 가 User-agent * 에 Disallow /w/(api.php 포함) → 쓰지 않음. qlever.dev robots.txt 없음(404 = 허용). 파일 40개씩 15초 간격"
    refresh: quarterly
    daily_limit: 1500           # = wikidata_official.photo_daily_limit (place_names 가 씀)
    interval_s: 15
    # process 의 place-desc 단계(scripts/place_names.py)가 부른다 — 수집 순환(collect)의 수집기가 아니라 external(osm·tourapi 와 같은 꼴)
    status: external
    fields: [P275, P170]
  - id: official_sites
    name: 공식 사이트 구조화 데이터(schema.org JSON-LD·microdata) — Wikidata P856 씨앗
    kind: crawl
    url: "(사이트마다 다름)"
    license: "사실값만(이름·주소·좌표·영업시간·요금·공식 전화·행사 일정). 본문 글·사진은 복사하지 않고 링크만"
    attribution: "각 공식 사이트(주소 링크)"
    robots: "사이트마다 매번 실시간 확인. 403 → 7일, 429 → Retry-After(최소 1일) 쉼"
    refresh: hourly
    daily_limit: 3000
    interval_s: 1
    timeout_s: 20
    retries: 1
    script: crawl
    shards: 6
    status: active
  - id: mobility_gtfs
    name: Mobility Database 카탈로그 → 공개 GTFS (정류장·노선)
    kind: feed
    url: https://files.mobilitydatabase.org/feeds_v2.csv
    license: "카탈로그 CC0. 피드마다 urls.license — 열린 라이선스로 판정된 피드만 받음(그 피드의 라이선스·제공자를 행마다 기록)"
    attribution: "Mobility Database (CC0) · 각 교통 사업자(피드별 라이선스)"
    license_url: https://github.com/MobilityData/mobility-database-catalogs
    robots: "files.mobilitydatabase.org — 실시간 확인"
    refresh: weekly
    daily_limit: 120
    interval_s: 3
    script: gtfs
    shards: 8
    status: active
    # (11/15) 보관 대상 도시 — 피드 bbox 가 겹치면 원본 zip 을 Storage collect/v1/gtfs/<라이선스 갈래>/<피드>/<날짜>.zip 에 보관하고 먼저 받는다.
    targets:
      - {city: seoul, bbox: [126.76, 37.41, 127.19, 37.71]}
      - {city: busan, bbox: [128.85, 35.03, 129.31, 35.33]}
      - {city: kyoto, bbox: [135.62, 34.88, 135.86, 35.15]}
      - {city: tokyo, bbox: [139.00, 35.50, 139.95, 35.90]}
      - {city: osaka, bbox: [135.35, 34.55, 135.65, 34.80]}
      - {city: paris, bbox: [2.10, 48.70, 2.60, 49.00]}
      - {city: bangkok, bbox: [100.30, 13.55, 100.95, 14.00]}
    # 자동 판정(license_open)에 걸리지 않지만 대표가 허락한 라이선스 주소 조각. 비어 있으면 아무것도 더 받지 않는다.
    # 후보: "Licence_Mobilit" — 일드프랑스 모빌리테(IDFM, 파리 지하철·RER·버스 전체, tdg-80921/80931/83316). 허락하면 이 줄을 목록에 넣는다.
    extra_licenses: []
  - id: taiwan_tourism
    name: 대만 교통부 관광서 관광자료(景點 - 觀光資訊資料庫, data.gov.tw 7777)
    kind: dump
    url: https://media.taiwan.net.tw/XMLReleaseAll_public/v2.0/Zh_tw/Attraction-json.zip
    license: OGDL-Taiwan-1.0 (政府資料開放授權條款-第1版, CC BY 4.0 호환)
    attribution: "交通部觀光署 觀光資訊資料庫 (政府資料開放授權條款-第1版)"
    license_url: https://data.gov.tw/dataset/7777
    robots: "실시간 확인"
    refresh: daily
