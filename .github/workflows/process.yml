# 트립루티 세계 수집 2단(가공)·3단(게시). collect 가 끝나면 자동(workflow_run) + 3시간마다 + 수동.
# 단계(11/17): partition(원본 → 나라별 대기함, 1대) → countries(나라 8 조각 동시에) → merge(조각 합치기) → place-desc(장소 소개 층) → publish. 근거·계산: docs/THROUGHPUT.md
# place-desc(11/17, 218기): 수집 층 wd·타일 id·OSM wikidata 태그의 QID → Wikidata 설명(QLever, CC0) + TourAPI 소개(공공누리 제1유형) + 대만 소개
#   → places/v1/layers_extra/desc-*.json.gz(출처마다 따로 파일, 5개 언어 칸). 실패해도 게시는 계속(이전 desc 파일이 실림). 끄기: 저장소 변수 PLACE_DESC_OFF=1.
#   수동 실행 only_desc=yes 면 가공(partition·countries·merge)을 건너뛰고 이 단계만 돈다.
# 가공: 정규화·좌표 검증·이름 5개 칸·분류·영업시간 표준형 → 출처 사이 같은 곳 묶기(이름+50m)·trust → places-world 타일과 중복 표시(wid) → 나라별 층(col_<cc>_<n>.json.gz).
# 게시: 품질 관문(나라별 -5% 감소·좌표·필수 칸·글자 깨짐·금지 도메인·표본 20곳) 통과 때만 publish_layers.py 로 새 태그(c<날짜시각>) — 앱 목록 places/v1/layers.json 갱신.
#   지금 목록의 다른 층(편의시설·인기·TourAPI 등)도 함께 실어 빠지지 않게 한다. 직전 3개 판 보관.
#   되돌리기(한 줄): gcloud storage cp gs://<bucket>/places/v1/<이전태그>/layers.json gs://<bucket>/places/v1/layers.json
# 관문 실패면 게시하지 않고 이슈를 만든다. 산출 데이터는 GitHub(Release·artifact·cache·로그)에 남기지 않는다.
name: process
on:
  workflow_run:
    workflows: [collect]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "가공 뒤 게시까지: yes | dry(서명·업로드 없이 관문·목록만) | no"
        default: "yes"
      only_desc:
        description: "장소 소개 단계(place-desc)만: yes | no"
        default: "no"
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: process
  cancel-in-progress: false
env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  STORE: gs://${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}/collect/v1
  KMS_SIGN_KEY: ${{ vars.KMS_SIGN_KEY || 'projects/trip-mate-0vum9k/locations/us-east1/keyRings/triproutie/cryptoKeys/places-manifest-ed25519/cryptoKeyVersions/1' }}
jobs:
  # 1) 원본 → 나라별 대기함 (러너 1대, 체크포인트). 시간 예산 안에 못 끝낸 원본은 다음 실행이 이어받는다.
  partition:
    if: github.repository == 'joon0515/triproutie-pipeline' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && github.event.inputs.only_desc != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q pyyaml >/dev/null
      - name: partition
        run: python3 scripts/collect/process.py process --stage partition --budget-min 150 --store "$STORE"
  # 2) 나라별 가공 — 나라를 8 조각(cc_shard)으로 나눠 러너 8대가 동시에. 조각은 제 파일(processed/shards/)에만 쓴다.
  #    조각 하나가 실패해도 나머지는 계속(fail-fast: false), 실패한 조각의 나라는 대기함·dirty 에 남아 다음 실행이 이어받는다.
  countries:
    needs: partition
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q pyyaml >/dev/null
      - name: countries ${{ matrix.shard }}/8
        run: |
          WT=$(gcloud storage cat "gs://$GCS_BUCKET/places/v1/manifest.json" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
          python3 scripts/collect/process.py process --stage countries --shard "${{ matrix.shard }}/8" --batch "${{ github.run_id }}-${{ github.run_attempt }}" --budget-min 240 --store "$STORE" ${WT:+--world "gs://$GCS_BUCKET/places/v1/$WT/tiles"}
  # 3) 조각 결과 합치기(latest.json) — 조각이 일부 실패해도 끝난 조각은 반영한다.
  merge:
    needs: [partition, countries]
    if: ${{ !cancelled() && needs.partition.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q pyyaml >/dev/null
      - name: merge
        run: python3 scripts/collect/process.py process --stage merge --batch "${{ github.run_id }}-${{ github.run_attempt }}" --store "$STORE"
  # 4) 장소 소개 층 — 게시 바로 앞. 시간 예산 50분(QLever 요청 5초 간격·하루 3000회, 다 못 물은 QID 는 다음 실행이 이어서).
  place-desc:
    needs: merge
    if: ${{ !cancelled() && github.repository == 'joon0515/triproutie-pipeline' && vars.PLACE_DESC_OFF != '1' && (needs.merge.result == 'success' || github.event.inputs.only_desc == 'yes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q pyyaml >/dev/null
      - name: place-desc
        run: python3 scripts/place_desc.py build --store "$STORE" --bucket "$GCS_BUCKET" --budget-min 50 ${{ github.event.inputs.publish == 'dry' && '--dry-run' || '' }}
  publish:
    needs: [merge, place-desc]
    if: ${{ !cancelled() && needs.merge.result == 'success' && github.event.inputs.publish != 'no' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 관문만 22분대(11/17) + 금지 링크 정리·서명·복사
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q pyyaml >/dev/null
      - name: gate + publish
        run: python3 scripts/collect/process.py publish --store "$STORE" --bucket "$GCS_BUCKET" --kms-key "$KMS_SIGN_KEY" --tools tools --alert "$RUNNER_TEMP/alert.md" ${{ github.event.inputs.publish == 'dry' && '--dry-run' || '' }}
      - name: issue when gate blocks
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/alert.md" ] || echo "게시 단계 실패(관문 밖 오류) — Actions 로그 확인" > "$RUNNER_TEMP/alert.md"
          T="수집 게시 중단: 품질 관문"
          N="$(gh issue list --state open --search "$T in:title" --json number -q '.[0].number')"
          if [ -z "$N" ]; then gh issue create --title "$T" --body-file "$RUNNER_TEMP/alert.md"; else gh issue comment "$N" --body-file "$RUNNER_TEMP/alert.md"; fi
