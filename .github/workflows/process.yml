# 트립루티 세계 수집 2단(가공)·3단(게시). collect 가 끝나면 자동(workflow_run) + 3시간마다 + 수동.
# 가공: 정규화·좌표 검증·이름 5개 칸·분류·영업시간 표준형 → 출처 사이 같은 곳 묶기(이름+50m)·trust → places-world 타일과 중복 표시(wid) → 나라별 층(col_<cc>_<n>.json.gz).
# 게시: 품질 관문(나라별 -5% 감소·좌표·필수 칸·글자 깨짐·금지 도메인·표본 20곳) 통과 때만 publish_layers.py 로 새 태그(c<날짜시각>) — 앱 목록 places/v1/layers.json 갱신.
#   지금 목록의 다른 층(편의시설·인기·TourAPI 등)도 함께 실어 빠지지 않게 한다. 직전 3개 판 보관.
#   되돌리기(한 줄): gcloud storage cp gs://<bucket>/places/v1/<이전태그>/layers.json gs://<bucket>/places/v1/layers.json
# 관문 실패면 게시하지 않고 이슈를 만든다. 산출 데이터는 GitHub(Release·artifact·cache·로그)에 남기지 않는다.
name: process
on:
  workflow_run:
    workflows: [collect]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "가공 뒤 게시까지: yes | dry(서명·업로드 없이 관문·목록만) | no"
        default: "yes"
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: process
  cancel-in-progress: false
env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  STORE: gs://${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}/collect/v1
  KMS_SIGN_KEY: ${{ vars.KMS_SIGN_KEY || 'projects/trip-mate-0vum9k/locations/us-east1/keyRings/triproutie/cryptoKeys/places-manifest-ed25519/cryptoKeyVersions/1' }}
jobs:
  process:
    if: github.repository == 'joon0515/triproutie-pipeline' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml >/dev/null
      - name: process
        run: |
          WT=$(gcloud storage cat "gs://$GCS_BUCKET/places/v1/manifest.json" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
          python3 scripts/collect/process.py process --store "$STORE" ${WT:+--world "gs://$GCS_BUCKET/places/v1/$WT/tiles"}
  publish:
    needs: process
    if: ${{ github.event.inputs.publish != 'no' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml >/dev/null
      - name: gate + publish
        run: python3 scripts/collect/process.py publish --store "$STORE" --bucket "$GCS_BUCKET" --kms-key "$KMS_SIGN_KEY" --tools tools --alert "$RUNNER_TEMP/alert.md" ${{ github.event.inputs.publish == 'dry' && '--dry-run' || '' }}
      - name: issue when gate blocks
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/alert.md" ] || echo "게시 단계 실패(관문 밖 오류) — Actions 로그 확인" > "$RUNNER_TEMP/alert.md"
          T="수집 게시 중단: 품질 관문"
          N="$(gh issue list --state open --search "$T in:title" --json number -q '.[0].number')"
          if [ -z "$N" ]; then gh issue create --title "$T" --body-file "$RUNNER_TEMP/alert.md"; else gh issue comment "$N" --body-file "$RUNNER_TEMP/alert.md"; fi
