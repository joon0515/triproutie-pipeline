# 트립루티 places-layers — 편의시설 층(OSM)·이름 보충 층(OSM) 지역별 병렬 빌드 → Firebase Storage 비공개 경로(places/v1/<tag>/layers/) → KMS 서명 목록(layers.json).
# places-world.yml 과 같은 방식: 수동 실행(workflow_dispatch)만, WIF(OIDC) 로그인, KMS Ed25519 서명, 산출물은 GitHub(Release·artifact·cache·로그)에 남기지 않음.
# (11/15) 자동 실행: 매월 2일 = 전 지역(all — 태국·라오스·프랑스 포함 29개) OSM 다시 받기 + 영업시간 층(OSM opening_hours → 타일 id) 원본 만들기,
#   매주 월요일 = merge 만(OSM 은 그대로, 세계 수집의 공식 사이트 JSON-LD 영업시간·사진 층을 최신 판에 다시 합쳐 서명). 수동 실행은 그대로.
# (11/17) GitHub 예약 실행은 자주 빠진다(11/16 월요일 merge 미실행). collect.yml 의 chain 이 같은 주기(주 1회 merge·월 1회 full all)를 보충한다.
# 인기 층(pop_*.json.gz — 위키 조회수)은 여기서 만들지 않는다(위키미디어 요청 제한 때문에 따로 천천히 만든 것을 layers_extra/ 로 넣는다 — README).
name: places-layers
run-name: "places-layers ${{ inputs.mode || github.event.schedule || 'full' }} ${{ inputs.groups || '' }}"   # 연쇄(collect.yml chain)가 full·merge 실행을 가려 본다
on:
  schedule:
    - cron: "40 17 2 * *"     # 매월 2일 UTC 17:40(KST 3일 02:40) — 전 지역 다시 만들기(Geofabrik 예절: 월 1회)
    - cron: "10 19 * * 1"     # 매주 월요일 UTC 19:10 — merge 만(공식 사이트 영업시간·사진 층을 최신 판에 합침)
  workflow_dispatch:
    inputs:
      tag:
        description: "판 이름(예 2026-11-20). 층 판은 타일 판과 따로 간다. 비우면 L-<오늘>(merge 면 최신 판)"
        default: ""
      groups:
        description: "지역 묶음(쉼표): priority(일본·한국·대만·홍콩) · asia · europe · americas · oceania · all, 또는 지역 이름(jp-kansai,kr)"
        default: "priority"
      names:
        description: "이름 보충 층도 만든다(world 가 적힌 지역만): yes | no"
        default: "yes"
      world_tag:
        description: "이름 보충 층을 붙일 세계 타일 판(places/v1/<world_tag>/tiles). 비우면 places/v1/manifest.json 의 version"
        default: ""
      mode:
        description: "full = 지역 빌드 + 목록 | merge = 빌드 없이 최신 판에 공식 영업시간·사진 층만 다시 합쳐 목록"
        default: "full"
permissions:
  contents: read
  id-token: write        # Workload Identity Federation(OIDC) 전용
concurrency:
  group: places-layers
  cancel-in-progress: false
env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  KMS_SIGN_KEY: ${{ vars.KMS_SIGN_KEY || 'projects/trip-mate-0vum9k/locations/us-east1/keyRings/triproutie/cryptoKeys/places-manifest-ed25519/cryptoKeyVersions/1' }}
jobs:
  plan:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.m.outputs.tag }}
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
          python: none
      - id: m
        run: |
          # 일정 실행: 월 2일 = full·all, 월요일 = merge. merge 의 판 = 지금 places/v1/layers.json 의 version
          MODE="${IN_MODE:-}"; LG="${IN_GROUPS:-}"   # GROUPS 는 bash 예약 변수라 쓰지 않음
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHED" = "40 17 2 * *" ]; then MODE=full; LG=all; else MODE=merge; fi
          fi
          MODE="${MODE:-full}"
          LATEST=""
          if [ "$MODE" = "merge" ] && [ -z "${IN_TAG:-}" ]; then
            LATEST=$(gcloud storage cat "gs://$GCS_BUCKET/places/v1/layers.json" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" || true)
          fi
          IN_MODE="$MODE" IN_GROUPS="${LG:-priority}" IN_LATEST="$LATEST" python3 scripts/layers_plan.py >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_GROUPS: ${{ inputs.groups }}
          IN_TAG: ${{ inputs.tag }}
  build:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8      # OSM 추출본 서버에 한꺼번에 몰리지 않게
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -q osmium >/dev/null
      - name: build-and-upload
        env:
          IN_NAMES: ${{ inputs.names }}
          IN_WORLD_TAG: ${{ inputs.world_tag }}
        run: bash scripts/run_layers_region.sh "${{ matrix.region }}" "${{ needs.plan.outputs.tag }}"
  finalize:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result != 'skipped' || needs.plan.outputs.mode == 'merge') }}   # 지역 몇 개가 실패해도 된 것만으로 목록을 만든다(없는 파일은 목록에 안 들어간다)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: bash scripts/finalize_layers.sh "${{ needs.plan.outputs.tag }}"
