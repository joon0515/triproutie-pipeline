# 트립루티 세계 수집 1단(collect) — 매시 정각. 계획(plan)이 출처×나라 조각을 골라 matrix 로 동시에 돌린다(최대 12 — 가공 조각 8 과 합쳐 무료 플랜 동시 20).
# 원칙: sources/registry.yaml 의 status: active 출처만, robots.txt 는 요청 때마다 실시간 확인, 사이트당 초당 1회 이하·하루 한도, UA 에 저장소 주소.
# 금지 목록 도메인은 코드가 자동 제외. 결과 원본은 Storage gs://<bucket>/collect/v1/raw/<출처>/<날짜>/ 에만(공개 저장소에는 작은 collect/status.json 만 커밋).
# 겹치면 앞 실행을 유지하고 새 실행은 1개만 기다린다(cancel-in-progress: false). 한 조각은 48분 예산 → 55분에 강제 종료.
name: collect
on:
  schedule:
    - cron: "23 * * * *"   # 정각은 GitHub 예약이 밀리거나 빠지기 쉬워 23분으로
  workflow_dispatch: {}
permissions:
  contents: write     # collect/status.json 커밋 전용
  id-token: write     # Workload Identity Federation(OIDC)
  issues: write       # 3회 연속 실패 경보
concurrency:
  group: collect
  cancel-in-progress: false
env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  STORE: gs://${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}/collect/v1
jobs:
  plan:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml holidays >/dev/null
      - name: test (mock, no network)
        run: python3 -W ignore -m unittest tests/test_collect.py tests/test_fill.py 2>&1 | tail -3
      - id: p
        env:
          HAS_FSQ_TOKEN: ${{ secrets.FSQ_TOKEN != '' }}
          COLLECT_MAX_JOBS: ${{ vars.COLLECT_MAX_JOBS || '12' }}
        run: python3 scripts/collect/run.py plan --store "$STORE" >> "$GITHUB_OUTPUT"
  collect:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 12   # 수집 12 + 가공 조각 8 = 동시 20(무료 플랜 한도, docs/THROUGHPUT.md)
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: collect-${{ matrix.source }}-${{ matrix.shard }}   # 같은 출처·조각만 겹치지 않게
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml holidays "duckdb==1.*" >/dev/null
      - name: collect ${{ matrix.source }} / ${{ matrix.shard }}
        env:
          FSQ_TOKEN: ${{ secrets.FSQ_TOKEN }}
          DUCK_MEM: 10GB
        run: python3 scripts/collect/run.py job --store "$STORE" --source "${{ matrix.source }}" --shard "${{ matrix.shard }}" --budget-min 48
  summary:
    needs: [plan, collect]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml >/dev/null
      - name: summary + status commit
        run: |
          python3 scripts/collect/run.py summary --store "$STORE" --out collect/status.json --alert "$RUNNER_TEMP/alert.md" | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collect/status.json
          if ! git diff --cached --quiet; then
            git commit -q -m "collect: 상태 $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do git push -q origin HEAD:main && break; sleep 5; git pull -q --rebase origin main; done
          fi
      - name: issue on 3 consecutive failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/alert.md" ] || exit 0
          T="수집 경보: 조각 3회 연속 실패"
          if [ -z "$(gh issue list --state open --search "$T in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$T" --body-file "$RUNNER_TEMP/alert.md" --label collect 2>/dev/null || gh issue create --title "$T" --body-file "$RUNNER_TEMP/alert.md"
          else
            gh issue comment "$(gh issue list --state open --search "$T in:title" --json number -q '.[0].number')" --body-file "$RUNNER_TEMP/alert.md"
          fi

  # GitHub 예약(schedule)이 이 저장소에서 한 번도 안 돌아서(11/15 확인), 수집이 끝나면 스스로 다음 회차를 건다.
  # workflow_dispatch 는 GITHUB_TOKEN 으로도 새 실행을 만든다(GitHub 문서). 끄려면 저장소 변수 CHAIN_OFF=1.
  chain:
    needs: [plan, collect, summary]
    if: ${{ always() && vars.CHAIN_OFF != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 가공(process) — 수집 직후 한 번
        run: gh workflow run process.yml --ref main
      - name: 1시간 간격 맞추기
        run: |
          st=$(gh api repos/$GH_REPO/actions/runs/${{ github.run_id }} -q .run_started_at)
          wait=$(( $(date -d "$st" +%s) + 3600 - $(date +%s) ))
          echo "다음 회차까지 ${wait}s"; if [ $wait -gt 0 ] && [ $wait -le 3600 ]; then sleep $wait; fi
      - name: 다음 수집 걸기
        run: gh workflow run collect.yml --ref main
      - name: TourAPI 하루 1회 (KST 00시대 이후, 오늘 실행 없을 때만)
        run: |
          today=$(TZ=Asia/Seoul date +%F); h=$(TZ=Asia/Seoul date +%H)
          last=$(gh run list -w tourapi_daily.yml -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null)
          lastk=$( [ -n "$last" ] && TZ=Asia/Seoul date -d "$last" +%F || echo none)
          if [ "$lastk" != "$today" ] && [ "$h" -ge 0 ]; then gh workflow run tourapi_daily.yml --ref main && echo "tourapi 걸음"; else echo "tourapi 오늘 이미 실행($lastk)"; fi
      - name: places-layers 주 1회 merge · 월 1회 full all (예약 실행이 빠질 때 보충, 끄려면 저장소 변수 LAYERS_CHAIN_OFF=1)
        if: ${{ vars.LAYERS_CHAIN_OFF != '1' }}
        run: |
          # 사진·영업시간 층은 places-layers 가 돌아야 게시된다. 진행 중인 실행이 있으면 걸지 않는다.
          runs=$(gh run list -w places-layers.yml -L 40 --json displayTitle,createdAt,status 2>/dev/null || echo '[]')
          dec=$(python3 - "$runs" <<'PY'
          # 판단(시험: tests/test_layers_chain.py 가 이 토막을 그대로 꺼내 돌린다). 이 job 은 checkout 을 하지 않아 스크립트를 여기 둔다.
          import datetime, json, os, sys
          runs = json.loads(sys.argv[1] or '[]')
          now = datetime.datetime.fromisoformat(os.environ.get('NOW') or datetime.datetime.now(datetime.timezone.utc).isoformat())
          at = lambda r: datetime.datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
          is_full = lambda r: r.get('displayTitle', '').startswith(('places-layers full all', 'places-layers 40 17 2'))
          if any(r.get('status') != 'completed' for r in runs):
              print('skip: 실행 중인 places-layers 가 있음')
          elif (now.day, now.hour) >= (2, 19) and not any(is_full(r) and (at(r).year, at(r).month) == (now.year, now.month) for r in runs):
              print('full: 이번 달 전 지역 빌드가 아직 없음')   # 성공·실패와 상관없이 한 달에 한 번만 건다
          elif not any((now - at(r)).days < 7 for r in runs):
              print('merge: 최근 7일 실행 없음')
          else:
              print('skip: 최근 실행 있음')
          PY
          )
          echo "places-layers: $dec"
          case "$dec" in
            full*)  gh workflow run places-layers.yml --ref main -f mode=full -f groups=all ;;
            merge*) gh workflow run places-layers.yml --ref main -f mode=merge ;;
          esac
