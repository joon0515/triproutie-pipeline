# (270기) Commons SDC 덤프(latest-mediainfo.json.bz2, 약 62GB) 판정 — scripts/commons_dump.py 머리말. 아래는 wikidata-dump.yml 과 같은 틀.
# 원래 머리말: Wikidata 주간 JSON 덤프(CC0) 대량 조인 — 5개 언어 라벨·설명·대표 사진(P18)을 QLever 한 곳씩 묻기 대신 한 주에 한 번 전부 채운다(11/18 233기, scripts/wd_dump.py).
# 받는 곳: 공식 https://dumps.wikimedia.org/wikidatawiki/entities/latest-all.json.bz2 (약 104GB, 한 스트림 bz2). 디스크에 내려받지 않고 Range 로 흘려 읽는다.
# 나누기: 파일을 jobs(24) × procs(2) = 48 조각으로 — 조각마다 범위 안 첫 bz2 블록부터 비트 단위로 맞춰 푼다(줄은 빠짐·겹침 없음, tests/test_wd_dump.py tests/test_commons_dump.py).
#   조각당 압축 약 2.2GB · 실측 1.4MB/s(코어 1개) → 약 30분. 러너(IP)마다 연결 2개, 동시 러너 4대(무료 동시 20 중 수집·가공 몫을 남김).
# 조인 열쇠 = place_desc 가 남기는 processed/desc/qids.json.gz(수집 층 wd · 세계 타일 Q-id · OSM wikidata 태그) — 223기 이름 층·218기 소개 층과 같은 씨앗.
# 결과: processed/desc/wd_dump.json.gz → 다음 process 의 place-desc 단계가 캐시에 덮어 쓰고 desc-wd·names-wd·photos-wd 층을 만들어 게시한다.
# 같은 덤프·새 씨앗 없음이면 건너뛴다(증분). 산출 데이터는 GitHub(Release·artifact·cache·로그)에 남기지 않는다.
name: commons-dump
on:
  schedule:
    - cron: "41 9 * * 6"     # 토요일 UTC 09:41 — 금요일 wikidata-dump 뒤(새 P18·도시 항목을 판정)
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: commons-dump
  cancel-in-progress: false
env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  STORE: gs://${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}/collect/v1
  JOBS: "24"
  PROCS: "2"
jobs:
  plan:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main' && vars.COMMONS_DUMP_OFF != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      any: ${{ steps.p.outputs.any }}
      meta: ${{ steps.p.outputs.meta }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml numpy >/dev/null
      - name: test (mock, no network)
        run: set -o pipefail; python3 -W ignore -m unittest tests/test_wd_dump.py tests/test_commons_dump.py 2>&1 | tail -3
      - id: p
        run: python3 scripts/commons_dump.py plan --store "$STORE" --jobs "$JOBS" --procs "$PROCS" >> "$GITHUB_OUTPUT"
  scan:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml numpy >/dev/null
      - name: scan ${{ matrix.job }}/${{ env.JOBS }}
        env:
          META: ${{ needs.plan.outputs.meta }}
        run: python3 scripts/commons_dump.py scan --store "$STORE" --job "${{ matrix.job }}" --jobs "$JOBS" --procs "$PROCS" --meta "$META"
  merge:
    needs: [plan, scan]
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' }}   # 조각 몇 개가 실패해도 된 것만 합친다(빠진 파일은 다음 주에 다시)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml >/dev/null
      - name: merge
        env:
          META: ${{ needs.plan.outputs.meta }}
        run: python3 scripts/commons_dump.py merge --store "$STORE" --meta "$META" --jobs "$JOBS"
