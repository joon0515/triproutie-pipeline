# (299기) GCS 버킷 정리 — 수동 실행 전용(예약 없음). scripts/dedup_gcs.py 머리말이 규칙이다.
#   mode=dry    : 객체 목록(메타데이터만, 다운로드 0)과 작은 포인터 json 으로 지울 목록을 만든다 → Step Summary + artifact 'dedup-plan'(plan.json·sha256·목록).
#   mode=delete : plan_run_id 의 artifact 를 받아 plan.json sha256 이 plan_sha256 과 같을 때만, 그 목록(scope)만 지운다.
#                 지우기 직전 보존 목록을 다시 만들어 겹치면 멈추고, generation 이 바뀐 객체는 건너뛴다. 지운 뒤 verify(최신 포인터의 모든 경로 존재) + manifest HEAD.
#   scope=old(참조 없는 옛 판, 내용이 다름)는 confirm_old=YES-OLD 가 있어야 지운다.
# 지키는 것: collect/v1/raw/** 전부, 최신 layers.json·manifest.json·latest.json 이 가리키는 경로, 되돌리기용 이전 판, 판 폴더 밖의 모든 경로(워크플로가 이름 규칙으로 읽음).
# 비용: 목록 요청(Class A) = 객체 수 / 1000 건($0.005/1000) · 포인터 읽기 수 MB(gcs-meter 상한 50 MB) · 지우기 요청은 무료.
name: dedup-gcs
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, options: [dry, delete], default: dry, description: "dry = 목록만 · delete = dry 결과 목록만 지움"}
      scope: {type: choice, options: [dup, old], default: dup, description: "dup = 같은 내용 사본 · old = 참조 없는 옛 판(confirm_old 필요)"}
      plan_run_id: {type: string, required: false, default: "", description: "delete: dry 실행의 run id"}
      plan_sha256: {type: string, required: false, default: "", description: "delete: dry Step Summary 의 plan.json sha256"}
      confirm_old: {type: string, required: false, default: "", description: "scope=old 일 때만 YES-OLD"}
permissions:
  contents: read
  id-token: write
  actions: read
concurrency:
  group: dedup-gcs
  cancel-in-progress: false
env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  GCS_DL_CAP_BYTES: "52428800"   # 실행당 GCS 다운로드 상한 50 MB(포인터 json 만 읽음)
jobs:
  dry:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main' && inputs.mode == 'dry'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q "google-cloud-storage==2.*" >/dev/null
      - name: 계획(목록만)
        run: set -o pipefail; python3 scripts/dedup_gcs.py plan --bucket "$GCS_BUCKET" --out "$RUNNER_TEMP/plan" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dedup-plan, path: "${{ runner.temp }}/plan/", retention-days: 7, if-no-files-found: ignore}
      - name: gcs-meter report (실행당 GCS 다운로드 바이트 · 상한 넘었으면 실패)
        if: always()
        run: set -o pipefail; gcloud gcs-meter report | tee -a "$GITHUB_STEP_SUMMARY"
  delete:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main' && inputs.mode == 'delete'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dedup-plan, path: "${{ runner.temp }}/plan", run-id: "${{ inputs.plan_run_id }}", github-token: "${{ github.token }}"}
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q "google-cloud-storage==2.*" >/dev/null
      - name: 지우기(해시가 같은 계획의 목록만)
        env: {SHA: "${{ inputs.plan_sha256 }}", SCOPE: "${{ inputs.scope }}", CONFIRM: "${{ inputs.confirm_old }}"}
        run: |
          set -o pipefail
          python3 scripts/dedup_gcs.py delete --bucket "$GCS_BUCKET" --out "$RUNNER_TEMP/plan" --plan "$RUNNER_TEMP/plan/plan.json" \
            --sha256 "$SHA" --scope "$SCOPE" --confirm-old "$CONFIRM" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 확인 — 최신 포인터가 가리키는 모든 경로(목록만) + manifest HEAD
        if: always()
        run: |
          set -o pipefail
          python3 scripts/dedup_gcs.py verify --bucket "$GCS_BUCKET" --out "$RUNNER_TEMP/plan" | tee -a "$GITHUB_STEP_SUMMARY"
          U="https://storage.googleapis.com/$GCS_BUCKET/places/v1/manifest.json"
          A=$(curl -s -o /dev/null -I -w '%{http_code}' -H "Authorization: Bearer $(gcloud auth print-access-token)" "$U")
          N=$(curl -s -o /dev/null -I -w '%{http_code}' "$U")
          echo "- manifest HEAD(본문 받지 않음): 로그인 $A · 익명 $N(비공개 버킷이면 403 이 정상)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$A" = "200" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dedup-delete-result, path: "${{ runner.temp }}/plan/*summary.md", retention-days: 7, if-no-files-found: ignore}
      - name: gcs-meter report (실행당 GCS 다운로드 바이트 · 상한 넘었으면 실패)
        if: always()
        run: set -o pipefail; gcloud gcs-meter report | tee -a "$GITHUB_STEP_SUMMARY"
