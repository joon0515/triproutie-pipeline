name: deploy-functions
# 서버 함수(flightLookup·geoLookup·deleteAccount) 배포 — Cloud Shell 수작업 대체.
# 지금 배포돼 있는 codebase "proxy" 그대로 쓰되, 반드시 함수 이름을 지정(--only functions:proxy:<이름>)해 배포한다.
# 이 저장소엔 proxy 의 일부(두 함수)만 있으므로 이름 없는 전체 배포(--only functions:proxy)는 금지 — 아래 deploy 단계가 막는다. --force 없음.
# 이름 지정 배포는 지정 밖 함수를 계획에서 빼므로(firebase-tools planner: endpointMatchesAnyFilter) placesSearch·g·roadRoute 등은 그대로.
# 비밀값은 읽지도 출력하지도 않는다(Secret 이름·켜진 버전 여부만 확인, 값은 함수 런타임이 Secret Manager 에서 받음).
on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json", ".github/workflows/deploy_functions.yml"]
  pull_request:
    paths: ["functions/**", "firebase.json", ".github/workflows/deploy_functions.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "배포할 함수(쉼표 구분)"
        default: "flightLookup,geoLookup"
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-functions
  cancel-in-progress: false
env:
  PROJECT: trip-mate-0vum9k
  REGION: asia-northeast3
  CODEBASE: proxy
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  # 입력·변수는 env 로만 넘긴다(셸에 직접 끼워 넣지 않음)
  ONLY: ${{ inputs.only || 'flightLookup,geoLookup' }}
  GEO_COORD: ${{ vars.GEO_COORD }}
  GEO_UA: ${{ vars.GEO_UA }}
  REQUIRE_APP_CHECK: ${{ vars.REQUIRE_APP_CHECK || 'false' }}
  ACCT_MAX_AUTH_AGE_MIN: ${{ vars.ACCT_MAX_AUTH_AGE_MIN || '0' }}
jobs:
  test:
    # PR·모든 브랜치: 키·GCP 없이 도는 시험(주소 검색 63건 + 진입점 불러오기). 항공 시험은 노선표가 GCS 에 있어 main 의 deploy 에서.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: geo test (63/0)
        run: |
          node test_geo_fn.js | tail -1 | tee /tmp/geo.txt
          grep -qx 'geo_fn: 63/0' /tmp/geo.txt
      - name: acct test (62/0)
        run: |
          node test_acct_fn.js | tail -1 | tee /tmp/acct.txt
          grep -qx 'acct_fn: 62/0' /tmp/acct.txt
      - name: live test (252기 liveBudget·placeDetailsLive)
        run: |
          set -o pipefail
          node test_live_fn.js | tail -1 | tee /tmp/live.txt
          grep -qx 'live_fn: 27/0' /tmp/live.txt
      - name: entry loads
        run: node -e "const e=require('./index.js'); for (const k of ['flightLookup','geoLookup','deleteAccount','liveBudget','placeDetailsLive']) if(!e[k]) throw new Error(k)"
  deploy:
    needs: test
    # Workload Identity 조건이 main 만 허용 → 배포는 main 의 push·수동 실행에서만.
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: functions/package-lock.json }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm ci --no-audit --no-fund
      - name: flight test (88/0, 실제 노선표)
        run: |
          gcloud storage cp "gs://$GCS_BUCKET/flight/v1/routes_iata.json.gz" /tmp/routes_iata.json.gz --quiet
          node test_flight_fn.js /tmp/routes_iata.json.gz | tail -1 | tee /tmp/flight.txt
          grep -qx 'flight_fn: 88/0' /tmp/flight.txt
      - name: geo test (63/0)
        run: |
          node test_geo_fn.js | tail -1 | tee /tmp/geo.txt
          grep -qx 'geo_fn: 63/0' /tmp/geo.txt
      - name: acct test (62/0)
        run: |
          node test_acct_fn.js | tail -1 | tee /tmp/acct.txt
          grep -qx 'acct_fn: 62/0' /tmp/acct.txt
      - name: deleteAccount preflight (읽기만 — 실행 계정 권한·comments 색인)
        # deleteAccount 를 배포할 때만. IAM·색인을 바꾸지 않고 조회만 한다. 못 읽거나 없으면 배포 중단(대표 확인 필요).
        if: contains(env.ONLY, 'deleteAccount')
        run: |
          FAIL=0
          SA=$(gcloud functions describe deleteAccount --project "$PROJECT" --region "$REGION" --gen2 --format='value(serviceConfig.serviceAccountEmail)' 2>/dev/null || true)
          [ -n "$SA" ] || SA=$(gcloud functions describe geoLookup --project "$PROJECT" --region "$REGION" --gen2 --format='value(serviceConfig.serviceAccountEmail)' 2>/dev/null || true)
          [ -n "$SA" ] || { echo "::error::함수 실행 계정을 읽지 못함"; exit 1; }
          echo "runtime SA: $SA"
          PR=$(gcloud projects get-iam-policy "$PROJECT" --flatten='bindings[].members' --filter="bindings.members:serviceAccount:$SA" --format='value(bindings.role)' 2>/tmp/iam.err) || { echo "::error::프로젝트 IAM 을 읽지 못함(조회 권한 없음)"; head -3 /tmp/iam.err; exit 1; }
          BR=$(gcloud storage buckets get-iam-policy "gs://$GCS_BUCKET" --flatten='bindings[].members' --filter="bindings.members:serviceAccount:$SA" --format='value(bindings.role)' 2>/dev/null || true)
          echo "project roles: $(echo $PR)"; echo "bucket roles: $(echo $BR)"
          any() { for r in "$@"; do echo "$PR $BR" | tr ' ' '\n' | grep -qx "$r" && return 0; done; return 1; }
          any roles/owner roles/editor roles/firebase.admin roles/firebaseauth.admin roles/firebase.developAdmin roles/firebase.sdkAdminServiceAgent || { echo "::error::$SA 에 Auth 사용자 삭제 권한 역할 없음"; FAIL=1; }
          any roles/owner roles/editor roles/firebase.admin roles/storage.admin roles/storage.objectAdmin roles/firebase.sdkAdminServiceAgent || { echo "::error::$SA 에 Storage 삭제 권한 역할 없음"; FAIL=1; }
          any roles/owner roles/editor roles/firebase.admin roles/datastore.owner roles/datastore.user roles/firebase.sdkAdminServiceAgent || { echo "::error::$SA 에 Firestore 쓰기 역할 없음"; FAIL=1; }
          IX=$(gcloud firestore indexes fields describe author --collection-group=comments --database='(default)' --project "$PROJECT" --format=json 2>/tmp/ix.err) || { echo "::error::comments.author 색인 설정을 읽지 못함"; head -3 /tmp/ix.err; exit 1; }
          echo "$IX" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);const ok=((x.indexConfig||{}).indexes||[]).some(i=>i.queryScope==='COLLECTION_GROUP'&&(i.fields||[]).some(f=>f.order)&&(!i.state||i.state==='READY'));console.log('comments.author collection-group index:',ok?'READY':'없음');process.exit(ok?0:1)})" || { echo "::error::comments 컬렉션 그룹 단일 필드 색인(author) 없음 — 콘솔에서 예외 추가 필요"; FAIL=1; }
          exit $FAIL
      - name: secrets present (이름·켜진 버전만)
        id: sec
        run: |
          has() { [ -n "$(gcloud secrets versions list "$1" --project "$PROJECT" --filter='state=ENABLED' --format='value(name)' --limit=1 2>/dev/null)" ]; }
          for s in DATA_GO_KR_KEY JUSO_KEY; do has $s || { echo "::error::Secret $s 없음/켜진 버전 없음(또는 권한 없음) — 배포 중단"; exit 1; }; echo "$s: 있음"; done
          # 좌표키: vars.GEO_COORD 가 true/false 면 그대로, 비어 있으면 Secret 이 보이면 true
          C="$GEO_COORD"
          if [ -z "$C" ]; then if has JUSO_COORD_KEY; then C=true; else C=false; fi; fi
          if [ "$C" = true ] && ! has JUSO_COORD_KEY; then echo "::error::GEO_COORD=true 인데 JUSO_COORD_KEY 가 안 보임"; exit 1; fi
          printf '{"coord":%s}\n' "$C" > geo_cfg.json
          echo "coord=$C" >> "$GITHUB_OUTPUT"; echo "geo coord=$C"
      - name: params (.env, 비밀 아님)
        run: |
          case "$REQUIRE_APP_CHECK" in true|false) ;; *) echo "::error::REQUIRE_APP_CHECK 는 true/false"; exit 1;; esac
          case "$GEO_COORD" in ""|true|false) ;; *) echo "::error::GEO_COORD 는 true/false/빈칸"; exit 1;; esac
          case "$ACCT_MAX_AUTH_AGE_MIN" in ""|*[!0-9]*) echo "::error::ACCT_MAX_AUTH_AGE_MIN 은 0 이상 정수"; exit 1;; esac
          { echo "REQUIRE_APP_CHECK=$REQUIRE_APP_CHECK"; u="${GEO_UA:-TripRoutie-geoLookup/1.0}"; printf 'GEO_UA="%s"\n' "${u//\"/}"; echo "ACCT_MAX_AUTH_AGE_MIN=$ACCT_MAX_AUTH_AGE_MIN"; } > .env
          if grep -qE '^(DATA_GO_KR_KEY|JUSO_KEY|JUSO_COORD_KEY)=' .env; then echo "::error::.env 에 Secret 이름"; exit 1; fi
          cat .env
      - name: deploy (이름 지정만, --force 없음)
        working-directory: .
        run: |
          case "$ONLY" in *[!A-Za-z0-9,]*|""|,*|*,|*,,*) echo "::error::only 형식 오류(함수 이름을 쉼표로)"; exit 1;; esac
          for n in $(echo "$ONLY" | tr ',' ' '); do case $n in flightLookup|geoLookup|deleteAccount) ;; *) echo "::error::$n 은 이 저장소 함수가 아님"; exit 1;; esac; done
          F=$(echo "$ONLY" | tr ',' '\n' | sed "s/^/functions:$CODEBASE:/" | paste -sd, -)
          echo "targets=$F"
          npx -y firebase-tools@15 deploy --project "$PROJECT" --only "$F" --non-interactive 2>&1 | tee /tmp/deploy.log | grep -E "✔|Error|error|Deploy complete|ecret|⚠|delet" | head -40
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::배포 실패"; tail -40 /tmp/deploy.log; exit 1; }
      - name: verify (401·바인딩·인스턴스 상한)
        run: |
          FAIL=0
          d() { gcloud functions describe "$1" --project "$PROJECT" --region "$REGION" --gen2 --format="value($2)" 2>/dev/null; }
          for fn in $(echo "$ONLY" | tr ',' ' '); do
            case $fn in
              flightLookup) BODY='{"no":"KE081","date":"2026-11-16"}'; NEED=DATA_GO_KR_KEY; MAXI=2 ;;
              geoLookup) BODY='{"q":"부산 해운대구 우동","lang":"ko"}'; NEED=JUSO_KEY; MAXI=1 ;;
              deleteAccount) BODY='{"mode":"preview"}'; NEED=; MAXI=2 ;;
              *) BODY='{}'; NEED=; MAXI= ;;
            esac
            SEC=$(d $fn 'serviceConfig.secretEnvironmentVariables[].key'); MI=$(d $fn 'serviceConfig.maxInstanceCount')
            CODE=$(curl -s -o /tmp/b.txt -w '%{http_code}' -X POST -H 'content-type: application/json' -d "$BODY" "https://$REGION-$PROJECT.cloudfunctions.net/$fn")
            echo "$fn: no-auth=$CODE secrets=[$SEC] maxInstances=$MI"
            [ "$CODE" = 401 ] || { echo "::error::$fn 인증 없이 $CODE (401 이어야 함)"; FAIL=1; }
            [ -z "$NEED" ] || echo "$SEC" | grep -q "$NEED" || { echo "::error::$fn Secret $NEED 바인딩 없음"; FAIL=1; }
            [ -z "$MAXI" ] || [ "$MI" = "$MAXI" ] || { echo "::error::$fn maxInstances $MI (기대 $MAXI)"; FAIL=1; }
          done
          exit $FAIL
