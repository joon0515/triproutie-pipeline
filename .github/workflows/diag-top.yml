# (270기 진단, 수동) 한국 3도시 관광·명소 상위 50 표 — scripts/diag_top.py. 대표 지시로 공개 장소 이름을 로그에 낸다(한 번 보고 지워도 됨).
name: diag-top
on:
  workflow_dispatch:
    inputs:
      cities:
        description: "도시 key(쉼표)"
        default: "seoul,busan,jeju"
permissions:
  contents: read
  id-token: write
jobs:
  diag:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-setup
        with:
          wif: "${{ vars.GCP_WIF_PROVIDER }}"
          sa: "${{ vars.GCP_SA_EMAIL }}"
      - run: pip install -q pyyaml h3 >/dev/null
      - env:   # 289기(SCAN1120 S10): 입력은 env 로만(run 에 끼워 넣지 않음)
          IN_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
          IN_CITIES: ${{ inputs.cities }}
        run: python3 scripts/diag_top.py --bucket "$IN_BUCKET" --cities "$IN_CITIES"
