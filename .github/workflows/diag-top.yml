# (270기 진단, 수동) 한국 3도시 관광·명소 상위 50 표 — scripts/diag_top.py. 대표 지시로 공개 장소 이름을 로그에 낸다(한 번 보고 지워도 됨).
name: diag-top
on:
  workflow_dispatch:
    inputs:
      cities:
        description: "도시 key(쉼표)"
        default: "seoul,busan,jeju"
permissions:
  contents: read
  id-token: write
jobs:
  diag:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml h3 >/dev/null
      - run: python3 scripts/diag_top.py --bucket "${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}" --cities "${{ inputs.cities }}"
