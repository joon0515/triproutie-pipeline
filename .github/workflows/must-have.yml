# 꼭 있어야 할 명소 점검·보충(col_mustadd_*·photos-must-*) — 270기. scripts/must_have.py 머리말.
# 하루 1번 + commons-dump 뒤 + 수동. 결과는 Storage places/v1/layers_extra/ 에만(publish 가 함께 게시). 보고에는 공개 명소(Wikidata 라벨) 이름만.
name: must-have
on:
  schedule:
    - cron: "29 6 * * *"
  workflow_run:
    workflows: [commons-dump]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: must-have
  cancel-in-progress: false
env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}
  STORE: gs://${{ vars.GCS_BUCKET || 'trip-mate-0vum9k.firebasestorage.app' }}/collect/v1
jobs:
  must:
    if: github.repository == 'joon0515/triproutie-pipeline' && github.ref == 'refs/heads/main' && vars.MUST_HAVE_OFF != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/222914945328/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SA_EMAIL || 'pipeline-uploader@trip-mate-0vum9k.iam.gserviceaccount.com' }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pyyaml h3 >/dev/null
      - name: test (mock, no network)
        run: set -o pipefail; python3 -W ignore -m unittest tests/test_must_have.py 2>&1 | tail -3
      - name: build
        run: |
          set -o pipefail
          python3 scripts/must_have.py build --store "$STORE" --bucket "$GCS_BUCKET" --out "$RUNNER_TEMP/must" | tail -60
          rm -rf "$RUNNER_TEMP/must"
